name: static quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate entry registry
        shell: pwsh
        run: ./scripts/validate-registry.ps1

      - name: Validate rule content
        shell: pwsh
        run: ./scripts/validate-content.ps1
