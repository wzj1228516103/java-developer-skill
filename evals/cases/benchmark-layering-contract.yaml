# 稳定的用例标识。
id: benchmark-layering-contract
title: Web 层应隔离 DTO 和持久化对象
description: |
  基准用例：验证 Controller、Service、Repository 的职责边界，以及对外响应不会直接暴露 Entity。
tag: benchmark
input:
  prompt: |
    这是文本交付任务：请在最终回复中给出所需代码、设计或审查结论。仅查看题目提供的上下文和适用的 Skill 文件，无需创建工程、写入工作区文件或执行构建；评分对象是最终回复。
    设计一个 Spring Boot 查询用户详情的接口，只需要给出 Controller、请求或路径参数、Service、Repository 和响应对象的关键代码。请保持分层，Controller 不要直接调用 Repository，对外不要直接返回 JPA Entity，并说明参数校验位置。

expect:
  must_contain:
    - "Controller"
    - "Service"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["DTO", "VO", "Response"]
    - output_contains:
        any: ["@Valid", "@NotNull", "@NotBlank", "校验"]
    - output_contains:
        not: ["Controller 直接调用 Repository", "controller直接调用repository", "return entity;", "return userEntity;"]
