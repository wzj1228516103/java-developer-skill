id: security-upload-ssrf
title: SSRF、路径穿越与文件上传
description: 验证 Skill 是否识别外部 URL 请求、用户文件名和上传内容带来的安全风险。
input:
  prompt: |
    Review 这个头像接口：客户端提交 avatarUrl 和 fileName，服务端直接请求 avatarUrl 下载内容，并把结果写到 /data/avatar/ + fileName。请指出 SSRF、路径穿越和不安全文件上传风险，并给出最小的服务端防护方案。
constraints:
  timeout_seconds: 240
  max_turns: 5
expect:
  must_contain:
    - "SSRF"
    - "路径穿越"
    - "白名单"
    - "大小"
    - "类型"
