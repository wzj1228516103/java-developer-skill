id: context-budget
title: 简单问题不扫描工作区
description: 验证 Skill 在自包含的低风险问题上直接回答，不读取仓库、模板或无关规则。
input:
  prompt: |
    Java 中比较两个字符串应该使用什么方式？请给出一句解释和一段最小代码，不要讨论项目架构。
constraints:
  timeout_seconds: 240
  max_turns: 4
expect:
  must_contain:
    - "equals"
  must_not_contain:
    - "扫描工作区"
    - "读取 README"
    - "遍历仓库"
    - "完整 Review 清单"
