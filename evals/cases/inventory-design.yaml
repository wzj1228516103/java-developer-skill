# 稳定的用例标识。
id: inventory-design
title: 设计并发安全且可重试的库存扣减方案
description: |
  验证设计入口是否围绕数据正确性、事务边界和失败路径做取舍，而不是只给出表面 API 设计。
tag: functional_test
input:
  prompt: |
    这是文本交付任务：请在最终回复中给出所需代码、设计或审查结论。仅查看题目提供的上下文和适用的 Skill 文件，无需创建工程、写入工作区文件或执行构建；评分对象是最终回复。
    设计一个 Spring Boot 的库存扣减方案：同一商品会并发扣减，客户端可能重复提交，扣减成功后还要发送下单事件。请给出关键表字段和约束、接口入参、并发控制、幂等处理、事务边界、消息投递失败时的补偿或重试策略，以及必须验证的测试场景。明确哪些远程调用不能放在本地数据库事务里，并说明假设。

expect:
  exit_code: 0

judge:
  # 并发与恢复方案允许合法替代实现，使用语义判定。
  type: agent_judge
  model: gpt-6.1-sol
  pass_threshold: 1.0
  criteria:
    - 明确数据库和业务假设、数量校验及关键约束；采用条件更新、正确锁策略或等价原子机制防止并发超卖，以更新结果判断扣减是否成功；不能只先查库存再无条件写回
    - 请求幂等有稳定业务键及数据库唯一约束或等价并发保护，明确重复请求的返回与参数冲突；本地扣减、幂等结果及待发送事件通过 Outbox 或等价可靠机制原子持久化，消息发送和不可控 HTTP/RPC 在本地数据库事务之外
    - 消息失败有有限重试或有退避的持续投递、崩溃恢复及消费幂等；长期失败持久保留并可告警重放，PARKED、失败队列、保留失败记录等均可，不要求死信等固定词语；不把未知是否送达的消息立即视为确定失败而盲目回补库存
    - '这是文本设计任务：提供并发超卖、同键重复、数据库回滚、消息投递失败及重复消费的测试方案和预期最终状态即可，不要求创建工程或实际执行数据库/MQ测试；不得虚构执行结果，不把 Mock 调用次数当成数据库事务或端到端一致性的证明'
