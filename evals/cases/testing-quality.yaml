id: testing-quality
title: 测试分层与关键路径覆盖
description: 验证 Skill 是否区分单元/集成测试，并覆盖边界、异常、权限和可靠性路径。
input:
  prompt: |
    请为一个调用库存服务并创建订单的 Java Service 设计测试方案。要求说明哪些用单元测试、哪些用集成测试，并覆盖成功、库存不足、权限失败、重复请求、下游超时和消息重复等路径。
constraints:
  timeout_seconds: 240
  max_turns: 5
expect:
  must_contain:
    - "单元测试"
    - "集成测试"
    - "异常"
    - "幂等"
    - "超时"
