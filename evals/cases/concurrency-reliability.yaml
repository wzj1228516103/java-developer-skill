id: concurrency-reliability
title: 并发与外部调用可靠性
description: 验证 Skill 是否覆盖线程池、超时、有限重试、幂等和异步异常传播。
input:
  prompt: |
    设计一个异步调用库存 HTTP 服务的任务。请说明线程池如何管理、连接/读取/整体超时如何设置、临时错误如何有限重试，以及非幂等操作和异步异常如何处理。
constraints:
  timeout_seconds: 240
  max_turns: 5
expect:
  must_contain:
    - "线程池"
    - "超时"
    - "重试"
    - "幂等"
    - "异常"
