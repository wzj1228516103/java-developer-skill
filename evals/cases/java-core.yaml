id: java-core
title: 日期时间与金额 API
description: 验证 Skill 是否优先使用 java.time 和 BigDecimal，避免线程不安全日期格式器与 double 金额计算。
input:
  prompt: |
    请写一个纯 Java 的订单金额和时间格式化示例：金额需要计算单价乘数量，时间按 yyyy-MM-dd HH:mm:ss 格式化。给出最小可用代码，并说明关键类型选择。
constraints:
  timeout_seconds: 240
  max_turns: 4
expect:
  must_contain:
    - "DateTimeFormatter"
    - "BigDecimal"
    - "java.time"
  must_not_contain:
    - "new SimpleDateFormat"
    - "double total"
    - "Double.parseDouble"
