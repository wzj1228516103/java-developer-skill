schema_version: v1alpha1

environment:
  type: none
  workspace_mount: /workspace

skills:
  - source: local_path
    path: .
    # 评测只安装路由和规则文件；模板、项目偏好和 README 不属于这些自包含场景。
    include:
      - SKILL.md
      - skills/**/SKILL.md
      - references/**
      - agents/**
      - .codex-plugin/plugin.json
      - skills.registry.json
    exclude:
      - README.md
      - project/README.md
      - evals/**
      - .git/**

engine:
  name: codex
  model: {}

cases:
  files:
    - evals/cases/controller-validation.yaml
    - evals/cases/sql-injection.yaml
    - evals/cases/transaction-rpc.yaml
    - evals/cases/security-ownership.yaml
    - evals/cases/cache-mq.yaml
    - evals/cases/legacy-refactor.yaml
    - evals/cases/context-budget.yaml
    - evals/cases/scope-minimal-java.yaml
    - evals/cases/java-core.yaml
    - evals/cases/concurrency-reliability.yaml
  defaults:
    timeout_seconds: 420
    max_turns: 8
  parallelism: 1

benchmark:
  enabled: true

judge:
  type: rule_based
  success:
    - exit_code: 0

report:
  formats: [json, junit, html]
  artifacts:
    - transcript
